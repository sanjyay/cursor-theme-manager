<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="12" y="12" width="232" height="232" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Main Adwaita Cursor Outline & Shape -->
  <g filter="url(#shadow)">
    <!-- Scaled & Centered 96px Adwaita Default Cursor Asset -->
    <image href="data:image/png;base64,"
           x="32" y="24" width="192" height="192" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
