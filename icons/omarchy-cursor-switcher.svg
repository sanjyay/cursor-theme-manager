<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2b3d"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="pointerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>
    <linearGradient id="swatch1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#fab387"/>
    </linearGradient>
    <linearGradient id="swatch2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="none" stroke="#45475a" stroke-width="2"/>

  <!-- Theme Swatch Circles (Indicating Theme Switching) -->
  <circle cx="188" cy="72" r="18" fill="url(#swatch1)"/>
  <circle cx="188" cy="72" r="18" fill="none" stroke="#181825" stroke-width="3"/>

  <circle cx="198" cy="116" r="14" fill="url(#accentGrad)"/>
  <circle cx="198" cy="116" r="14" fill="none" stroke="#181825" stroke-width="2.5"/>

  <circle cx="184" cy="156" r="11" fill="url(#swatch2)"/>
  <circle cx="184" cy="156" r="11" fill="none" stroke="#181825" stroke-width="2"/>

  <!-- Sparkle / Star on top left -->
  <path d="M 68 52 Q 68 64 56 64 Q 68 64 68 76 Q 68 64 80 64 Q 68 64 68 52 Z" fill="#f9e2af"/>

  <!-- Main Adwaita-style Cursor Shadow -->
  <path d="M 66 58 L 66 186 L 98 154 L 126 216 L 148 206 L 120 144 L 166 144 Z" fill="#11111b" opacity="0.45"/>

  <!-- Main Adwaita-style Cursor Outline -->
  <path d="M 60 50 L 60 180 L 92 148 L 120 210 L 142 200 L 114 138 L 160 138 Z" fill="#11111b" stroke="#11111b" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Main Adwaita-style Cursor Body -->
  <path d="M 60 50 L 60 180 L 92 148 L 120 210 L 142 200 L 114 138 L 160 138 Z" fill="url(#pointerGrad)"/>

  <!-- Inner accent line on the cursor -->
  <path d="M 68 68 L 68 155 L 90 133 L 116 191" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
